plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.bone88.socialmanager'
    compileSdk 36
    defaultConfig {
        applicationId 'com.bone88.socialmanager'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '1.2.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
